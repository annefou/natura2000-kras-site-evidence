# Single source of truth for the runtime — used by local dev, Docker, and CI.
# Add every dependency a notebook imports here. Local "kitchen-sink" envs
# (e.g. pangeo) hide missing deps; CI builds strictly from this file and will
# silently produce empty notebook cells if anything is missing.
#
# pixi.lock (committed alongside this file) pins every package to an exact
# build hash per platform. Regenerate it with `pixi install` after editing
# this file; commit both files in the same commit.

[workspace]
name = "natura2000-kras-site-evidence"
# bioconda hosts snakemake (and downstream rule-engine ecosystem); conda-forge
# is the priority channel for everything else.
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[dependencies]
python = "3.12.*"
# --- core scientific stack ---
numpy = "*"
pandas = ">=2.0"
xarray = ">=2024.6"
scipy = "*"
matplotlib = "*"
pyarrow = "*"
# Pillow downscales + base64-inlines the headline figure into the reader-facing
# story page (scripts/build_story.py), so the generated HTML is self-contained.
pillow = "*"
# --- notebook execution + Jupyter Book ---
jupytext = "*"
jupyterlab = "*"
nbclient = "*"
ipykernel = "*"
# --- pipeline driver ---
snakemake = "*"
# --- replace/extend with the deps your replication needs ---
# Examples (uncomment as needed):
# statsmodels = "*"          # GLM/GLMM regression
# scikit-learn = "*"         # classical ML
# pyproj = "*"               # CRS + map projections
# cartopy = "*"              # geographic plotting
# netcdf4 = "*"              # NetCDF I/O — preferred over .npz for arrays (see DOMAIN.md)
# zarr = "*"                 # Zarr — preferred for arrays >2 GB or cloud-archived (see DOMAIN.md)
# cdsapi = "*"               # Copernicus Climate Data Store
# copernicusmarine = "*"     # Copernicus Marine Service
# healpix-geo = "*"          # HEALPix on geo data — preferred (use nest=True — see DOMAIN.md)
# healpy = "*"               # HEALPix on pure-sphere (astrophysics) only
# rasterio = "*"             # raster I/O
# geopandas = "*"            # vector I/O
# dask = "*"                 # out-of-core / parallel

# --- this study ---
httpx = ">=0.27"             # EEA / Reportnet / CLMS / GBIF queries in pipeline/builders/
requests = ">=2.31"          # used by healpix-connector's GBIF connector
shapely = ">=2.0"            # clip CORINE polygons and GBIF records to the site boundary
healpix-geo = ">=0.4.1"      # HEALPix on the WGS84 ellipsoid (GRID4EARTH), NESTED; 0.4.1 is what ran
zarr = ">=3"                 # GRID4EARTH DGGS-Zarr v3 store of the species cells
geopandas = ">=1.0"          # RABA (MKGP land use) vectors: read, reproject, clip
pyogrio = "*"                # fast shapefile reading straight from the downloaded zip
pyproj = "*"                 # D48/GK (EPSG:3912, RABA <= 2018) -> D96/TM (EPSG:3794)
libarchive = "*"             # bsdtar: unpacks the RAR snapshots of RABA (2011-2022)
laspy = ">=2.5"              # national LiDAR point clouds (.laz), pipeline/lidar/
lazrs-python = "*"           # LAZ decompression backend for laspy

# Pip-only deps go in [pypi-dependencies]. Conda-forge is preferred where available.
[pypi-dependencies]
# healpix-connector v0.1.0, pinned to the release whose version DOI the species crate cites
# (10.5281/zenodo.22904851). Git tag, not a local path, so a fresh clone works anywhere.
healpix-connector = { git = "https://github.com/annefou/healpix-connector.git", tag = "v0.1.0" }
# pygbif = "*"               # GBIF occurrences
# polytope-client = "*"      # Destination Earth Climate DT
# earthkit-data = "*"

[feature.docs.dependencies]
mystmd = "*"

[feature.tests.dependencies]
pytest = "*"
# ruamel.yaml round-trips YAML *with* its comments. scripts/set_release_identifiers.py
# rewrites CITATION.cff in place, and pyyaml would silently delete every
# explanatory comment in it.
"ruamel.yaml" = "*"
# rdflib parses the nanopub TEMPLATE TriG that IS the schema for each FORRT chain
# step. scripts/template_fields.py extracts the field spec from it; the offline
# tests and scripts/check_template_drift.py both need it. See nanopubs/templates/.
rdflib = "*"

[environments]
default = { solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
tests = { features = ["tests"], solve-group = "default" }

[tasks]
run = "snakemake --cores 1"
# Rebuild every EU and species input from its source (network, ~3 min), then the analysis.
rebuild = "snakemake --cores 1 --config rebuild=1 --forcerun site_crate hrl_grassland"
# National Land Use database (MKGP RABA): LOCAL results only (results/local/, gitignored).
raba = "snakemake --cores 1 --config raba=1"
# Regenerate the GBIF download request for a person to submit on gbif.org.
gbif-request = "python pipeline/builders/gbif_request.py --site SI3000276"
# 2022 Kras fire test (pipeline/fire/): open inputs, then RABA sampling and analysis. RABA-derived
# results stay in results/local/fire/ (gitignored) until MKGP grants written permission.
fire-inputs = "bash pipeline/fire/fetch_inputs.sh"
fire-sample = "python pipeline/fire/sample_points.py RABA_2009_10_16.ZIP RABA_2012_12_04.RAR RABA_2015_06_30.RAR RABA_2018_06_30.RAR RABA_2021_07_06.RAR RABA_2022_06_30.zip RABA_2024_06_30.zip RABA_2026_09_30.zip"
fire = { cmd = "python pipeline/fire/fire_analysis.py && python pipeline/fire/fire_analysis.py --perimeter=effis", depends-on = ["fire-inputs", "fire-sample"] }
# National LiDAR feasibility check: one Kras tile onto HEALPix (summary in results/lidar/).
lidar-check = "python pipeline/lidar/read_tile.py"
book = "myst build --html"
lab = "jupyter lab"

# The `tests` feature and environment already existed here; nothing declared a
# task and no workflow ever invoked pytest, so it was scaffolding that had never
# run. Wired into ci.yml.
#   pixi run -e tests test
[feature.tests.tasks]
test = "pytest tests/ -q"
# Compares the live FORRT templates against nanopubs/templates/fields.snapshot.json.
# Networked, so NOT in the per-PR gate — run on demand or on schedule
# (.github/workflows/template-drift.yml). `--update` re-vendors the snapshot.
check-templates = "python scripts/check_template_drift.py"
# Builds nanopubs/chain-draft.json (the pre-filled hand-off for the Science Live
# FORRT-chain wizard) from CITATION.cff + the drafts + PUBLISHED.md. Offline, no
# Claude. See docs/chain-draft-contract.md. Run after drafting, then commit the file.
build-chain-draft = "python scripts/build_chain_draft.py"
sync-drafts = "python scripts/sync_draft_skeletons.py"
# Generates the reader-facing story page (blog/index.html) from the PUBLISHED
# chain: fetches the constellation for the apex in nanopubs/PUBLISHED.md (the
# Research Synthesis if published, else the Replication Outcome) and renders a
# self-contained HTML article — nothing invented, every value from the signed
# nanopubs. Needs SCIENCELIVE_API_KEY. Deterministic: commit blog/ and publish
# it wherever the repo already publishes (e.g. GitHub Pages). See docs/story-page.md.
build-story = "python scripts/build_story.py"
